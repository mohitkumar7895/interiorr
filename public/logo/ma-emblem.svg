<svg viewBox="0 0 300 240" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-auto">
  <defs>
    <linearGradient id="embRoof" x1="20" y1="10" x2="280" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="35%" stop-color="#F5D58A" />
      <stop offset="70%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#9C6B17" />
    </linearGradient>

    <linearGradient id="embGold" x1="60" y1="50" x2="240" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9DE" />
      <stop offset="25%" stop-color="#F7DF94" />
      <stop offset="60%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#8A5A0F" />
    </linearGradient>

    <filter id="embBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#FFEAA7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Chimney on left -->
  <path d="M 70 65 L 70 30 L 84 30 L 84 54" stroke="url(#embRoof)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Main Gabled Peak Outer -->
  <path d="M 25 118 L 150 18 L 275 118" stroke="url(#embRoof)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#embBevel)" />
  <path d="M 42 115 L 150 32 L 258 115" stroke="url(#embRoof)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- 4-Pane Window at the Peak -->
  <g transform="translate(139, 48)" stroke="url(#embRoof)" stroke-width="1.8" fill="#D9A441" fill-opacity="0.2">
    <rect x="0" y="0" width="9" height="9" rx="1" />
    <rect x="13" y="0" width="9" height="9" rx="1" />
    <rect x="0" y="13" width="9" height="9" rx="1" />
    <rect x="13" y="13" width="9" height="9" rx="1" />
  </g>

  <!-- Center MA Letters -->
  <g filter="url(#embBevel)">
    <!-- M Left Stem -->
    <path d="M 68 180 L 68 82 L 82 82 L 82 180 Z" fill="url(#embGold)" />
    <path d="M 60 82 L 90 82 L 90 87 L 60 87 Z" fill="url(#embRoof)" />
    <path d="M 60 175 L 90 175 L 90 180 L 60 180 Z" fill="url(#embRoof)" />

    <!-- M Diagonals -->
    <path d="M 80 82 L 126 156 L 140 156 L 94 82 Z" fill="url(#embGold)" />
    <path d="M 140 156 L 186 82 L 172 82 L 126 156 Z" fill="url(#embRoof)" opacity="0.9" />

    <!-- M Right Stem -->
    <path d="M 172 82 L 186 82 L 186 180 L 172 180 Z" fill="url(#embGold)" />
    <path d="M 164 175 L 194 175 L 194 180 L 164 180 Z" fill="url(#embRoof)" />

    <!-- A Diagonals -->
    <path d="M 166 180 L 216 82 L 232 82 L 180 180 Z" fill="url(#embGold)" />
    <path d="M 220 82 L 270 180 L 252 180 L 208 90 Z" fill="url(#embRoof)" />
    <!-- A Crossbar -->
    <path d="M 188 142 L 240 142 L 242 149 L 186 149 Z" fill="url(#embGold)" />
    <path d="M 210 82 L 238 82 L 238 86 L 210 86 Z" fill="url(#embRoof)" />
    <path d="M 244 175 L 274 175 L 274 180 L 244 180 Z" fill="url(#embRoof)" />
  </g>

  <!-- Swoop / Base Arc -->
  <path d="M 30 188 Q 150 215 270 188 Q 150 205 30 188 Z" fill="url(#embGold)" />
</svg>

