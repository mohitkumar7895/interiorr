<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#F5D58A" />
      <stop offset="70%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#B8832A" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9A441" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#glow)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Outer Luxury Border -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="744" height="544" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="6,4" />

  <!-- Corner Flourishes -->
  <path d="M 28 48 L 48 48 L 48 28" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 772 48 L 752 48 L 752 28" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 28 552 L 48 552 L 48 572" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M 772 552 L 752 552 L 752 572" fill="none" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Center Emblem -->
  <g transform="translate(400, 260)">
    <!-- Hexagonal Crest -->
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1c1914" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" />

    <!-- "MA" Initials Monogram -->
    <text x="0" y="16" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">MA</text>
  </g>

  <!-- Typography -->
  <text x="400" y="380" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">MA CARPENTER &amp; INTERIOR</text>
  <text x="400" y="410" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="600" fill="#a89a80" text-anchor="middle" letter-spacing="4">LUXURY CRAFTSMANSHIP &bull; SECTOR 120 NOIDA</text>
  <text x="400" y="440" font-family="'Playfair Display', Georgia, serif" font-size="13" font-style="italic" fill="#80725a" text-anchor="middle">Designing Spaces, Defining Lifestyles</text>
</svg>
